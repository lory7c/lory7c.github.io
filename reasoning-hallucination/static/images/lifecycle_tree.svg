    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #616866" x="35.712" y="504.1728" transform="rotate(-0 35.712 504.1728)">An organizational map, not a causal sequence. UIPCA fields are diagnostic coordinates, not mandatory sequential stages.</text>
   </g>
